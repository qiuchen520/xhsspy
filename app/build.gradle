plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rxw.xhsspy'
    compileSdk 34

    defaultConfig {
        applicationId "com.rxw.xhsspy"
        minSdk 21
        // 模块本体其实不参与运行时存储策略，给高一点避免新版系统拒装
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // 模块不是上架应用，不需要 Play 那套 targetSdk 规则
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // 模块必须能直接安装到手机，未签名的 APK 装不上。
            // 用 debug 证书签就够（LSPatch 不校验证书，只要求 APK 可安装）。
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // Xposed API 只编译期用，绝不能打进包里
    compileOnly 'de.robv.android.xposed:api:82'
}
